name: Save NSE index closes

on:
  schedule:
    - cron: '45 13 * * 1-5'
    - cron: '45 15 * * 1-5'
    - cron: '15 18 * * 1-5'
    - cron: '15 2 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch NSE ind_close_all files
        run: python fetch.py
      - name: Commit new files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily/ || true
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "NSE index closes $(date -u +%Y-%m-%d)"
            git push
          fi
